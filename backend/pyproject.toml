[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-decision-intelligence-platform"
version = "1.0.0"
description = "AI-powered Decision Intelligence Platform for Hospitals"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.0",
    "email-validator>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "scikit-learn>=1.4.1post1",
    "xgboost>=2.0.3",
    "prophet>=1.1.5",
    "shap>=0.45.0",
    "openpyxl>=3.1.2",
    "weasyprint>=61.1",
    "structlog>=24.1.0",
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "ruff==0.8.0",
    "mypy>=1.9.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["storage*", "tests*"]
